[package]
name = "typstray-dev"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
typst = { git = "https://github.com/typst/typst.git", rev = "a6dcd82927b2a44bb089bc9151e29566e84e7d5a" }
typst-syntax = { git = "https://github.com/typst/typst.git", rev = "a6dcd82927b2a44bb089bc9151e29566e84e7d5a" }
typst-eval = { git = "https://github.com/typst/typst.git", rev = "a6dcd82927b2a44bb089bc9151e29566e84e7d5a" }
typst-layout = { git = "https://github.com/typst/typst.git", rev = "a6dcd82927b2a44bb089bc9151e29566e84e7d5a" }

typstray-common.workspace = true
wasm-bindgen.workspace = true
js-sys.workspace = true
serde_json.workspace = true
time.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom.workspace = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
